[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-coach-api"
version = "2.0.0"
description = "HTTP API of osu! coach (FastAPI): the middle layer between the osu-coach domain and the web app."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "osu-coach>=2.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "scalar-fastapi>=1.9.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
osu-coach-api = "osu_coach_api.server:main"

[tool.setuptools.packages.find]
include = ["osu_coach_api*"]

[tool.setuptools.package-data]
osu_coach_api = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# newer Starlette prefers httpx2 for its TestClient; httpx works the same and keeps older versions working
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "B008", "UP040"]

[tool.ruff.lint.isort]
known-first-party = ["osu_coach", "osu_coach_api"]
