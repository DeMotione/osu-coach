[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-coach"
version = "0.10.2"
description = "osu! coach: replay analysis, skill profile, tips and map playlists, with a local web app."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
    "rosu-pp-py>=4,<5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "scalar-fastapi>=1.9.1",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "osrparse>=7", "httpx>=0.27", "ruff>=0.6", "import-linter>=2"]

[project.scripts]
osu-coach = "osu_coach.cli:main"
osu-coach-api = "osu_coach.app.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osu_coach = ["infra/data/*.json.gz", "features/play_goals/data/*.json.gz", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# newer Starlette prefers httpx2 for its TestClient; httpx works the same and keeps older versions working
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "TID251"]
ignore = ["E501", "E731", "B905", "B007", "B023", "E741", "B008", "UP040"]

[tool.ruff.lint.per-file-ignores]
# unused locals that predate the linter; left as they are so the analysis code stays untouched
"src/osu_coach/infra/analysis.py" = ["F841"]
"src/osu_coach/domain/beatmaps/features.py" = ["F841"]
"tests/domain/player/test_weighting.py" = ["F841"]
# the one place that reads the clock; tests may make their own times
"src/osu_coach/infra/clock.py" = ["TID251"]
"tests/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Read the time through osu_coach.infra.clock, so tests can pin it."
"datetime.datetime.utcnow".msg = "Read the time through osu_coach.infra.clock, so tests can pin it."
"datetime.datetime.today".msg = "Read the time through osu_coach.infra.clock, so tests can pin it."
"datetime.date.today".msg = "Use osu_coach.infra.clock.today(), so tests can pin it."
"time.time".msg = "Read the time through osu_coach.infra.clock (time.monotonic for durations)."

[tool.importlinter]
root_package = "osu_coach"
include_external_packages = true
# Workspace is only named in annotations of feature code; it is not a runtime dependency
exclude_type_checking_imports = true

# Vertical feature slices on a pure domain (see AGENTS.md):
#   app       composition root: app factory, Workspace, dependencies, job routes
#   features  one package per feature slice (routes, service, schemas, its own data access); slices never import
#             each other
#   infra     I/O several slices share: replay and beatmap files, rosu-pp, the analysis cache, the map pool,
#             progress.sqlite, settings.json, the job runner, the clock
#   common    what several slices' HTTP code shares: errors, conversions, shared response models
#   domain    pure business calculations: no I/O, no web, no clock

[[tool.importlinter.contracts]]
name = "layers: app -> features -> infra -> common -> domain"
type = "layers"
containers = ["osu_coach"]
layers = ["main | cli", "app", "features", "infra", "common", "domain"]
# routes reach the session's data through app.deps (the Workspace)
ignore_imports = ["osu_coach.features.*.routes -> osu_coach.app.deps"]

[[tool.importlinter.contracts]]
name = "feature slices never import each other"
type = "independence"
modules = [
    "osu_coach.features.check", "osu_coach.features.dashboard", "osu_coach.features.exports",
    "osu_coach.features.library", "osu_coach.features.maps", "osu_coach.features.play_goals",
    "osu_coach.features.progress", "osu_coach.features.settings", "osu_coach.features.system",
    "osu_coach.features.tips",
]
# the composition root (app) knows every slice: going through it is not a slice importing another
ignore_imports = ["osu_coach.features.*.routes -> osu_coach.app.deps"]

[[tool.importlinter.contracts]]
name = "domain subjects depend only downwards"
type = "layers"
containers = ["osu_coach.domain"]
layers = ["maps | progress | exports | play_goals", "player", "analysis", "beatmaps | replays", "numeric"]

[[tool.importlinter.contracts]]
name = "only app and the slices know the web framework"
type = "forbidden"
# the error types are plain exceptions (common/errors.py); app/errors.py turns them into responses
source_modules = ["osu_coach.infra", "osu_coach.common"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "rating engines never import each other"
type = "independence"
# what both need (the readiness result, demand curves, consistency, ranking, tempo scale) lives next to them in engines/
modules = ["osu_coach.domain.player.engines.comfort", "osu_coach.domain.player.engines.irt"]

[[tool.importlinter.contracts]]
name = "engine internals are reached only through engines/"
type = "protected"
protected_modules = ["osu_coach.domain.player.engines.comfort", "osu_coach.domain.player.engines.irt"]
# summary.py reduces a play once, to the per-play inputs of every engine
allowed_importers = ["osu_coach.domain.player.engines", "osu_coach.domain.player.summary"]

[[tool.importlinter.contracts]]
name = "the domain is pure: no I/O, web, settings or clock"
type = "forbidden"
source_modules = ["osu_coach.domain"]
forbidden_modules = [
    "osu_coach.config", "pandas", "requests", "rosu_pp_py", "fastapi", "starlette", "pydantic", "pydantic_settings", "uvicorn",
    "sqlite3", "os", "pathlib", "pickle", "lzma", "gzip", "shutil", "subprocess", "socket", "threading", "time",
    "random", "uuid", "urllib", "http", "tempfile", "logging",
]
