[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-coach"
version = "2.0.0"
description = "osu! coach: replay analysis, skill profile, tips and map playlists, with a local web app."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
    "rosu-pp-py>=4,<5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "scalar-fastapi>=1.9.1",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "osrparse>=7", "httpx>=0.27", "ruff>=0.6", "import-linter>=2"]

[project.scripts]
osu-coach = "osu_coach.cli:main"
osu-coach-api = "osu_coach.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osu_coach = ["infrastructure/data/*.json.gz", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# newer Starlette prefers httpx2 for its TestClient; httpx works the same and keeps older versions working
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "E731", "B905", "B007", "B023", "E741", "I001", "B008", "UP040"]

[tool.ruff.lint.per-file-ignores]
# unused locals that predate the linter; left as they are so the analysis code stays untouched
"src/osu_coach/domain/analysis.py" = ["F841"]
"src/osu_coach/domain/features.py" = ["F841"]
"tests/domain/test_weighting.py" = ["F841"]

[tool.importlinter]
root_package = "osu_coach"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is independent of every other layer and of I/O"
type = "forbidden"
source_modules = ["osu_coach.domain"]
forbidden_modules = [
    "osu_coach.infrastructure", "osu_coach.api", "osu_coach.config", "osu_coach.main", "osu_coach.cli",
    "requests", "fastapi", "pydantic", "pydantic_settings", "sqlite3",
]

[[tool.importlinter.contracts]]
name = "infrastructure does not depend on the API or entry points"
type = "forbidden"
source_modules = ["osu_coach.infrastructure"]
forbidden_modules = ["osu_coach.api", "osu_coach.main", "osu_coach.cli"]
