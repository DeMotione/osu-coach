name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: core + api (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e "./core[dev]" -e "./api[dev]"
      - name: Lint
        run: |
          ruff check core
          ruff check api
      - name: Test core
        working-directory: core
        run: pytest
      - name: Test api
        working-directory: api
        run: pytest

  web:
    name: web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -c ../constraints.txt -e ../core -e ../api
      - name: API types are up to date
        run: |
          python -m osu_coach_api.openapi src/api/openapi.json
          npm run gen:api
          git diff --exit-code -- src/api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
        env:
          OSU_COACH_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
