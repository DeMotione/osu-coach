name: Release

# A tag v<version> builds every installer and publishes them as a GitHub release. Pull requests that change how
# the installers are made build them too (without publishing), so a broken build shows up before the tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "desktop/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Every version number matches (and the tag, when releasing)
        id: check
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $found = [ordered]@{
            'backend/pyproject.toml' = (Select-String -Path backend/pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
            'backend/src/osu_coach/__init__.py' = (Select-String -Path backend/src/osu_coach/__init__.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
            'frontend/package.json' = (Get-Content frontend/package.json -Raw | ConvertFrom-Json -AsHashtable).version
            'frontend/package-lock.json' = (Get-Content frontend/package-lock.json -Raw | ConvertFrom-Json -AsHashtable).version
            'desktop/package.json' = (Get-Content desktop/package.json -Raw | ConvertFrom-Json -AsHashtable).version
            'desktop/package-lock.json' = (Get-Content desktop/package-lock.json -Raw | ConvertFrom-Json -AsHashtable).version
            'desktop/src-tauri/tauri.conf.json' = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json -AsHashtable).version
            'desktop/src-tauri/Cargo.toml' = (Select-String -Path desktop/src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
            'desktop/src-tauri/Cargo.lock' = (Get-Content desktop/src-tauri/Cargo.lock -Raw | Select-String -Pattern '(?m)^name = "osu-coach-desktop"\r?\nversion = "(.+)"').Matches[0].Groups[1].Value
          }
          $v = if ($env:REF_TYPE -eq 'tag') { ($env:REF_NAME).TrimStart("v") } else { $found['backend/pyproject.toml'] }
          $bad = $found.GetEnumerator() | Where-Object { $_.Value -ne $v }
          if ($bad) { throw "Version $v does not match: $(($bad | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ', ')" }
          "version=$v" >> $env:GITHUB_OUTPUT

  windows:
    name: Windows (setup, portable, msi)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: constraints.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ./backend pyinstaller pillow
          choco install innosetup --no-progress -y

      - name: Build web app
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Freeze the app
        run: |
          python packaging/make_icon.py
          python -m PyInstaller packaging/osu-coach.spec --noconfirm
          $env:OSU_COACH_PORTABLE = "1"
          python -m PyInstaller packaging/osu-coach.spec --noconfirm --distpath dist --workpath build/portable

      - name: Inno Setup installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging/installer.iss

      - name: MSI (Tauri)
        run: |
          New-Item -ItemType Directory desktop/src-tauri/resources -Force | Out-Null
          Copy-Item dist/osu-coach desktop/src-tauri/resources/osu-coach -Recurse
          cd desktop
          npm ci
          npx tauri build --bundles msi --config src-tauri/tauri.release.conf.json

      - name: Collect release files
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item "dist/osu-coach-$env:VERSION-setup.exe" release/
          Copy-Item dist/osu-coach-portable.exe "release/osu-coach-$env:VERSION-portable.exe"
          $msi = Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          Copy-Item $msi.FullName "release/osu-coach-$env:VERSION-x64.msi"
          Get-ChildItem release

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux (deb)
    needs: version
    # built on the oldest supported Ubuntu, so the package also runs on distributions with an older glibc
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: System packages (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: constraints.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ./backend pyinstaller

      - name: Build web app
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Freeze the app
        run: python -m PyInstaller packaging/osu-coach.spec --noconfirm

      - name: deb (Tauri)
        run: |
          mkdir -p desktop/src-tauri/resources
          cp -a dist/osu-coach desktop/src-tauri/resources/osu-coach
          cd desktop
          npm ci
          npx tauri build --bundles deb --config src-tauri/tauri.release.conf.json

      - name: Collect release files
        run: |
          mkdir release
          cp desktop/src-tauri/target/release/bundle/deb/*.deb "release/osu-coach_${VERSION}_amd64.deb"
          dpkg-deb --info release/*.deb

      - name: The installed package starts its server
        run: |
          sudo apt-get install -y ./release/*.deb
          server=$(dpkg -L osu-coach | grep '/osu-coach/osu-coach$')
          "$server" ui --no-browser --port 8599 &
          for i in $(seq 60); do curl -fs http://127.0.0.1:8599/api/health && exit 0; sleep 1; done
          echo "the bundled server did not answer" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{version}/${VERSION}/g" packaging/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" release/* --title "osu! coach $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
