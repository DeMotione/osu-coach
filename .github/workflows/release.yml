name: Release

# A tag v<version> builds every installer and publishes them as a GitHub release. Pull requests that change how
# the installers are made build them too (without publishing), so a broken build shows up before the tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "desktop/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Every version number matches (and the tag, when releasing)
        id: check
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $found = [ordered]@{
            'backend/pyproject.toml' = (Select-String -Path backend/pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
            'backend/src/osu_coach/__init__.py' = (Select-String -Path backend/src/osu_coach/__init__.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
            'frontend/package.json' = (Get-Content frontend/package.json -Raw | ConvertFrom-Json -AsHashtable).version
            'frontend/package-lock.json' = (Get-Content frontend/package-lock.json -Raw | ConvertFrom-Json -AsHashtable).version
            'desktop/package.json' = (Get-Content desktop/package.json -Raw | ConvertFrom-Json -AsHashtable).version
            'desktop/package-lock.json' = (Get-Content desktop/package-lock.json -Raw | ConvertFrom-Json -AsHashtable).version
            'desktop/src-tauri/tauri.conf.json' = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json -AsHashtable).version
            'desktop/src-tauri/Cargo.toml' = (Select-String -Path desktop/src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
            'desktop/src-tauri/Cargo.lock' = (Get-Content desktop/src-tauri/Cargo.lock -Raw | Select-String -Pattern '(?m)^name = "osu-coach-desktop"\r?\nversion = "(.+)"').Matches[0].Groups[1].Value
          }
          $v = if ($env:REF_TYPE -eq 'tag') { ($env:REF_NAME).TrimStart("v") } else { $found['backend/pyproject.toml'] }
          $bad = $found.GetEnumerator() | Where-Object { $_.Value -ne $v }
          if ($bad) { throw "Version $v does not match: $(($bad | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ', ')" }
          "version=$v" >> $env:GITHUB_OUTPUT

  windows:
    name: Windows (setup, msi, portable)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: constraints.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ./backend

      # the same script as a local build: web app, frozen server, then the setup, the .msi and the bare portable .exe
      # (the server is baked into the executable, so they need nothing else)
      - name: Desktop app (Tauri)
        env:
          PY: python
        run: desktop/src-tauri/build.bat

      - name: The lone exe starts its own server
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "lone"
          New-Item -ItemType Directory $dir -Force | Out-Null
          Copy-Item desktop/src-tauri/target/release/osu-coach-desktop.exe "$dir/osu! coach.exe"
          $app = Start-Process -FilePath "$dir/osu! coach.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 180 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $ok = (Invoke-RestMethod -TimeoutSec 2 http://127.0.0.1:8511/api/health).status -eq "ok" } catch {}
          }
          # unpacked by the app, not osu-coach-api from this runner's PATH (the app's fallback)
          $server = Get-Process osu-coach -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*\app.osucoach.desktop\runtime\*" }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Process osu-coach -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "the exe's server did not answer /api/health" }
          if (-not $server) { throw "the server that answered is not the one unpacked by the app" }
          "started $($server.Path)"

      - name: Collect release files
        run: |
          New-Item -ItemType Directory release | Out-Null
          $t = "desktop/src-tauri/target/release"
          Copy-Item (Get-ChildItem "$t/bundle/nsis/*-setup.exe" | Select-Object -First 1).FullName "release/osu-coach-$env:VERSION-setup.exe"
          Copy-Item (Get-ChildItem "$t/bundle/msi/*.msi" | Select-Object -First 1).FullName "release/osu-coach-$env:VERSION-x64.msi"
          Copy-Item "$t/osu-coach-desktop.exe" "release/osu-coach-$env:VERSION-windows-portable.exe"
          Get-ChildItem release

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux (deb)
    needs: version
    # built on the oldest supported Ubuntu, so the package also runs on distributions with an older glibc
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: System packages (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: constraints.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ./backend

      - name: deb (Tauri)
        env:
          PY: python
        run: bash desktop/src-tauri/build.sh

      - name: Collect release files
        run: |
          mkdir release
          cp desktop/src-tauri/target/release/bundle/deb/*.deb "release/osu-coach_${VERSION}_amd64.deb"
          dpkg-deb --info release/*.deb

      - name: The installed package starts its server
        run: |
          sudo apt-get install -y xvfb ./release/*.deb
          xvfb-run -a osu-coach-desktop &
          for i in $(seq 120); do
            if curl -fs http://127.0.0.1:8511/api/health; then
              # unpacked by the app, not osu-coach-api from this runner's PATH (the app's fallback)
              pgrep -af 'app.osucoach.desktop/runtime/.*/osu-coach ' && pkill -f osu-coach-desktop && exit 0
            fi
            sleep 1
          done
          echo "the app's server did not answer" >&2
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{version}/${VERSION}/g" packaging/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" release/* --title "osu! coach $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
