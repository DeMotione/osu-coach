[package]
name = "osu-coach-desktop"
version = "0.9.1"
description = "osu! coach desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[features]
# bakes server.zip (the frozen server, packaging/make_server_zip.py) into the executable
embedded-server = ["dep:zip"]
